name: Kazumi TV (armeabi-v7a)

# 用途：构建 32 位 armeabi-v7a 的 Kazumi，并给清单打上 Android TV 声明
# 官方 release 流程用的是 flutter build apk --split-per-abi，本来就会产出
# app-armeabi-v7a-release.apk，但只上传了 arm64 那份 —— 这里把 32 位那份捞出来。
#
# 排错记录（run #4 / run #5 连续两次 runner 侧崩）：
#   run #4: 构建实际已成功，但 runner 收尾时 "No space left on device"
#   run #5: 构建推进到 javac 后静默 16 分钟，随后进程被 SIGTERM(143) 掐断
#   → 两次都发生在我们比官方 CI 多做的两步上：jlumbroso/free-disk-space
#     （swap-storage:true 会**关掉 runner 的 swap**，4G Gradle 堆 + Flutter
#      工具链直接压爆内存，runner 进程被 OOM kill → GitHub 报 "runner has
#      received a shutdown signal"）和手动裁剪 Android SDK。
#   → 结论：官方 CI 在原封不动的 ubuntu-latest 上就能构建成功，别乱动 runner
#     环境。这里回归"最小偏差"，只保留必要的诊断信息。
on:
  workflow_dispatch:

jobs:
  build-armv7:
    name: Build Kazumi armeabi-v7a (TV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Kazumi source (Predidit/Kazumi@2.3.8)
        uses: actions/checkout@v4
        with:
          repository: Predidit/Kazumi
          ref: 2.3.8

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove build id from jni CMake (same as upstream CI)
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # run #5 卡死点：Gradle 文件系统监听抛 "Already watching path" 后构建挂住 16 分钟
      - name: Disable Gradle file-system watching
        run: |
          grep -q 'org.gradle.vfs.watch' android/gradle.properties \
            || echo 'org.gradle.vfs.watch=false' >> android/gradle.properties
          tail -3 android/gradle.properties

      - name: Patch AndroidManifest for Android TV
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          # 1) 电视相关 uses-feature（插到 <application 之前）
          feats = (
              '    <uses-feature android:name="android.software.leanback" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n'
          )
          if 'android.software.leanback' not in s:
              i = s.index('<application')
              s = s[:i] + feats + s[i:]

          # 2) 主 activity 的 intent-filter 增加 LEANBACK_LAUNCHER（电视桌面可见）
          old = '                <category android:name="android.intent.category.LAUNCHER"/>\n'
          new = old + '                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>\n'
          if 'LEANBACK_LAUNCHER' not in s and old in s:
              s = s.replace(old, new, 1)

          # 3) 电视横幅（复用应用图标资源）
          if 'android:banner' not in s:
              s = s.replace('android:icon="@mipmap/ic_launcher"',
                            'android:icon="@mipmap/ic_launcher"\n        android:banner="@mipmap/ic_launcher"', 1)

          open(p, 'w', encoding='utf-8').write(s)
          print('--- patched manifest (TV bits) ---')
          print('\n'.join(l for l in s.splitlines()
                          if any(k in l for k in ('leanback', 'LEANBACK', 'banner', 'touchscreen'))))
          PY

      - name: Build armv7 APK
        id: build
        run: |
          # 后台监控：磁盘/内存写进日志。runner 若再被外部掐断，API 侧仍能取到这段证据
          ( while true; do
              printf '%s DISK %s | MEM %s | TOP %s\n' "$(date -u +%H:%M:%S)" \
                "$(df -h / | awk 'NR==2{print $4" free, "$5" used"}')" \
                "$(free -m | awk 'NR==2{print $7"MB avail, "$3"MB used"}')" \
                "$(ps -eo rss,comm --sort=-rss | awk 'NR==2{print $2" "$1"MB"}')"
              sleep 30
            done ) >> build_log.txt &
          MON=$!
          set +e
          timeout 60m flutter build apk --release --target-platform android-arm 2>&1 | tee -a build_log.txt
          rc=${PIPESTATUS[0]}
          kill $MON 2>/dev/null
          wait $MON 2>/dev/null
          {
            echo "BUILD_EXIT=$rc"
            df -h /
            free -m
          } | tee -a build_log.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # 不在这里失败：保证后面的日志/产物上传步骤一定执行
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "flutter build exited with ${{ steps.build.outputs.exit_code }}"
          exit 1

      - name: Upload armeabi-v7a APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-armeabi-v7a-tv
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
