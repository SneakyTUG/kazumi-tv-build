name: Kazumi TV (armeabi-v7a)

# 用途：构建 32 位 armeabi-v7a 的 Kazumi，并给清单打上 Android TV 声明。
# 官方 release 流程用的是 flutter build apk --split-per-abi，本来就会产出
# app-armeabi-v7a-release.apk，但只上传了 arm64 那份 —— 这里把 32 位那份捞出来。
#
# 源码来源（2026-10-13 起）：直接检出 **SneakyTUG/Kazumi 的 tv 分支**（完整源码仓库，
# fork 自 Predidit/Kazumi，README 带修改声明）。TV 适配改动直接提交到该仓库，
# 本 workflow 不再做补丁解包覆盖。
#
# ===== 排错记录（重要，别再踩）=====
# run #4/#5/#6 连续三次在 flutter build 中途 runner 侧死亡（#5 是 SIGTERM 143，
# #6 是步骤卡在 in_progress、后续全 pending）。真正原因：仓库是**私有**的，
# GitHub 对私有仓库只给 2 核 / 7G 内存的 runner，而 android/gradle.properties 里
# 写着 -Xmx4G，Gradle 堆直接压爆内存 → runner 进程被 OOM kill。
# 2026-10-13 把仓库改成公开后实测：4 核 / 16G 内存 / 3G swap / 86G 可用磁盘，
# 与官方 CI（Predidit/Kazumi 是公开仓库，构建一直稳定成功）完全一致。
# → 以后这个仓库必须保持 public，别改回 private。
#
# run #8~#10 连续失败：根因不是 path:、也不是 checkout 拉第三方库的授权，
# 而是 **tag 名写错**——Predidit/Kazumi 的发布 tag 是 `2.3.8`（没有 v 前缀）。
#
# run #17 装机报 INSTALL_FAILED_UPDATE_INCOMPATIBLE：电视上的 Kazumi 被换过渠道，
# 签名不匹配。解法：pm uninstall 先卸载再 install（数据会清空）。
on:
  workflow_dispatch:

jobs:
  build-armv7:
    name: Build Kazumi armeabi-v7a (TV)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # TV 适配源码仓库（fork + tv 分支），检出到根目录。
      # 公开仓库，actions/checkout 默认 GITHUB_TOKEN 即可读取。
      - name: Checkout Kazumi TV source (SneakyTUG/Kazumi@tv)
        uses: actions/checkout@v4
        with:
          repository: SneakyTUG/Kazumi
          ref: tv

      # 校验 TV 改动真的在源码里（防止分支被误回退后静默构建出无适配的包）
      - name: Verify TV adaptation present
        run: |
          grep -rl "SettingsRadioScope" lib/bean/settings/settings_list.dart || exit 1
          grep -rl "togglepanel" lib/utils/constants.dart lib/pages/player/player_item.dart || exit 1
          test -f lib/pages/player/player_tv_panel.dart || exit 1
          grep -q "_TvRail" lib/pages/menu/menu.dart || exit 1
          grep -q "sidePanelOpen" lib/pages/video/video_controller.dart || exit 1
          echo "--- TV adaptation verified ---"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove build id from jni CMake (same as upstream CI)
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Gradle 文件系统监听抛 "Already watching path" 后构建挂死
      - name: Disable Gradle file-system watching
        run: |
          grep -q 'org.gradle.vfs.watch' android/gradle.properties \
            || echo 'org.gradle.vfs.watch=false' >> android/gradle.properties
          tail -3 android/gradle.properties

      - name: Patch AndroidManifest for Android TV
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()

          # 1) 电视相关 uses-feature（插到 <application 之前）
          feats = (
              '    <uses-feature android:name="android.software.leanback" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n'
          )
          if 'android.software.leanback' not in s:
              i = s.index('<application')
              s = s[:i] + feats + s[i:]

          # 2) 主 activity 的 intent-filter 增加 LEANBACK_LAUNCHER（电视桌面可见）
          old = '                <category android:name="android.intent.category.LAUNCHER"/>\n'
          new = old + '                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>\n'
          if 'LEANBACK_LAUNCHER' not in s and old in s:
              s = s.replace(old, new, 1)

          # 3) 电视横幅（复用应用图标资源）
          if 'android:banner' not in s:
              s = s.replace('android:icon="@mipmap/ic_launcher"',
                            'android:icon="@mipmap/ic_launcher"\n        android:banner="@mipmap/ic_launcher"', 1)

          open(p, 'w', encoding='utf-8').write(s)
          print('--- patched manifest (TV bits) ---')
          print('\n'.join(l for l in s.splitlines()
                          if any(k in l for k in ('leanback', 'LEANBACK', 'banner', 'touchscreen'))))
          PY

      - name: Build armv7 APK
        id: build
        run: |
          # 先记录 runner 规格 + 磁盘基线，出问题时不用再靠猜
          {
            echo "===== runner specs $(date -u +%FT%TZ) ====="
            echo "nproc: $(nproc)"
            free -m
            df -h /
            echo "gradle heap: $(grep -o '\-Xmx[0-9G]*' android/gradle.properties)"
            echo "===== build start ====="
          } > build_log.txt

          # 后台监控：磁盘/内存/最占内存进程，每 30 秒一条写进日志
          ( while true; do
              printf '%s DISK %s | MEM %s | TOP %s\n' "$(date -u +%H:%M:%S)" \
                "$(df -h / | awk 'NR==2{print $4" free, "$5" used"}')" \
                "$(free -m | awk 'NR==2{print $7"MB avail, "$3"MB used"}')" \
                "$(ps -eo rss,comm --sort=-rss | awk 'NR==2{print $2" "$1"MB"}')"
              sleep 30
            done ) >> build_log.txt &
          MON=$!
          set +e
          timeout 60m flutter build apk --release --target-platform android-arm \
            --dart-define=DANDANAPI_APPID="$DANDANAPI_APPID" \
            --dart-define=DANDANAPI_KEY="$DANDANAPI_KEY" \
            --dart-define=KAZUMI_APPID="$KAZUMI_APPID" \
            --dart-define=KAZUMI_KEY="$KAZUMI_KEY" \
            2>&1 | tee -a build_log.txt
          rc=${PIPESTATUS[0]}
          kill $MON 2>/dev/null
          wait $MON 2>/dev/null
          {
            echo "===== build exit=$rc $(date -u +%FT%TZ) ====="
            df -h /
            free -m
            echo "--- outputs ---"
            ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true
          } | tee -a build_log.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # 不在这里失败：保证后面的日志/产物上传步骤一定执行
          exit 0
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
          KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
          KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "flutter build exited with ${{ steps.build.outputs.exit_code }}"
          exit 1

      # 固定签名：flutter build --release 默认用 runner 随机 debug keystore，
      # 每次构建签名都不同 → 电视上 pm install -r 永远报
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE。这里用 repo secrets 里的固定
      # PKCS12 keystore 统一重签，以后可直接覆盖安装（数据不丢）。
      - name: Re-sign APK with fixed key
        if: steps.build.outputs.exit_code == '0'
        env:
          KZ_TV_KS_B64: ${{ secrets.KZ_TV_KS_B64 }}
          KZ_TV_KS_PASS: ${{ secrets.KZ_TV_KS_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          echo "$KZ_TV_KS_B64" | base64 -d > /tmp/kazumi-tv.p12
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" sign \
            --ks /tmp/kazumi-tv.p12 --ks-pass env:KZ_TV_KS_PASS \
            --key-pass env:KZ_TV_KS_PASS \
            --out /tmp/app-signed.apk "$APK"
          "$BT/apksigner" verify --print-certs /tmp/app-signed.apk
          mv /tmp/app-signed.apk "$APK"
          echo "--- re-signed OK ---"

      - name: Upload armeabi-v7a APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-armeabi-v7a-tv
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
